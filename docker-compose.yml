services:
  web:
    build: .
    container_name: arizona-ufop
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8198}:80"
      # Multisite de demonstracao (departamentos extra, mesmo codebase/container):
      - "${DFIS_PORT:-8299}:80"
      - "${DEMAT_PORT:-8399}:80"
      - "${DEMED_PORT:-8499}:80"
      - "${DEFIL_PORT:-8599}:80"
      - "${DELET_PORT:-8699}:80"
      - "${DEPRO_PORT:-8799}:80"
      - "${DEMET_PORT:-8899}:80"
      - "${DESOC_PORT:-8999}:80"
      - "${DEQUI_PORT:-9099}:80"
      - "${DECOM_PORT:-9199}:80"
    volumes:
      # Imagens enviadas pelo site (noticias, avatares etc.) sobrevivem a
      # rebuilds/deploys - sem isso, tudo volta ao conteudo da imagem a cada deploy.
      - ./web/sites/default/files:/app/web/sites/default/files
      - ./web/sites/dfis/files:/app/web/sites/dfis/files
      - ./web/sites/demat/files:/app/web/sites/demat/files
      - ./web/sites/demed/files:/app/web/sites/demed/files
      - ./web/sites/defil/files:/app/web/sites/defil/files
      - ./web/sites/delet/files:/app/web/sites/delet/files
      - ./web/sites/depro/files:/app/web/sites/depro/files
      - ./web/sites/demet/files:/app/web/sites/demet/files
      - ./web/sites/desoc/files:/app/web/sites/desoc/files
      - ./web/sites/dequi/files:/app/web/sites/dequi/files
      - ./web/sites/decom/files:/app/web/sites/decom/files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: arizona-ufop-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-db}
      MYSQL_USER: ${DB_USER:-db}
      MYSQL_PASSWORD: ${DB_PASSWORD:-db}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
